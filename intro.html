<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Valeria</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="wrapped.css">
  <link rel="stylesheet" href="intro.css">
</head>
<body>

  <!-- Fondo -->
  <div class="stage" aria-hidden="true">
    <div class="scene s4 active">
      <div class="blob b1"></div>
      <div class="blob b2"></div>
      <div class="blob b3"></div>
      <div class="rings"></div>
      <div class="checker"></div>
      <div class="bars"></div>
      <svg class="squiggle" viewBox="0 0 400 200">
        <path pathLength="1000" d="M5 120 C 60 20, 100 200, 160 100 S 260 20, 320 110 S 380 150, 395 90"/>
      </svg>
      <svg class="flower" viewBox="0 0 100 100">
        <path d="M50 50 C30 5,70 5,50 50 C95 30,95 70,50 50 C70 95,30 95,50 50 C5 70,5 30,50 50Z"/>
      </svg>
      <svg class="star" viewBox="0 0 100 100">
        <path d="M50 0 L61 39 L100 50 L61 61 L50 100 L39 61 L0 50 L39 39Z"/>
      </svg>
      <svg class="tube" viewBox="0 0 400 200">
        <defs>
          <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#ffffff"/>
            <stop offset=".3" stop-color="#8d8d8d"/>
            <stop offset=".5" stop-color="#ffffff"/>
            <stop offset=".75" stop-color="#3c3c3c"/>
            <stop offset="1" stop-color="#e9e9e9"/>
          </linearGradient>
        </defs>
        <path d="M20 90 C 120 -40, 160 190, 240 90 S 330 20, 385 140"/>
      </svg>
    </div>
  </div>

  <!-- Mensaje + botón -->
  <main class="intro">
    <p class="msg" aria-live="polite"><span id="typed"></span><span id="rest"></span></p>
    <a class="intro-btn" href="wrapped.html">¿Quieres escuchar?</a>
  </main>

  <!-- AUDIO MP3: la ruta se asigna en intro.js (constante CANCION) -->
  <audio id="audio" preload="auto"></audio>

  <script src="intro.js"></script>
</body>
</html>
